<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<meta name="description" content="Бункер — онлайн-игра на выживание и переговоры. Мест меньше, чем людей.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Бункер — онлайн-игра</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Порядок подключения важен: токены → база → фон → компоненты → экраны → анимации → адаптив -->
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/background.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/screens.css">
<link rel="stylesheet" href="styles/animations.css">
<link rel="stylesheet" href="styles/responsive.css">
<link rel="stylesheet" href="styles/redesign.css">
</head>
<body>

<!-- ЖИВОЙ ФОН. Слои пустые: наполняет их src/ui/components/background.js -->
<div class="bg" aria-hidden="true">
  <div class="bg__layer bg__depth"></div>
  <div class="bg__layer bg__concrete"></div>
  <div class="bg__layer bg__walls"></div>
  <div class="bg__layer bg__pipes" aria-hidden="true"></div>
  <div class="bg__layer bg__door"></div>

  <div class="bg__layer bg__lamps">
    <span class="lamp lamp--red-l"></span>
    <span class="lamp lamp--red-r"></span>
    <span class="lamp lamp--amber"></span>
    <span class="lamp lamp--cyan"></span>
    <span class="light-cone"></span>
  </div>

  <div class="bg__layer bg__haze">
    <span class="haze haze--a"></span>
    <span class="haze haze--b"></span>
  </div>

  <div class="bg__layer bg__dust"></div>
  <div class="bg__veil"></div>
  <div class="bg__grain"></div>
</div>

<!-- Сюда роутер монтирует оболочку приложения -->
<div id="root"></div>

<!-- Заставка на время загрузки модулей -->
<div class="boot">
  <div class="boot__mark">
    <div class="boot__ring"></div>
    <div class="boot__text">Проверка гермозатвора</div>
  </div>
</div>

<noscript>
  <div style="padding:32px;text-align:center;color:#f2f4f8;font-family:system-ui">
    Для игры нужен JavaScript.
  </div>
</noscript>

<script type="module" src="src/main.js"></script>
</body>
</html>
